<!-- Modal detail (carousel) -->
<div id="detailModal" class="fixed inset-0 z-[9999] hidden items-center justify-center overflow-y-auto bg-slate-950/70 p-4" role="dialog" aria-modal="true">
  <div class="relative w-full max-w-3xl overflow-hidden rounded-2xl bg-white shadow-2xl">
    <div class="border-b px-5 py-4">
      <div class="flex items-start justify-between gap-4">
        <div><h3 id="dmTitle" class="text-lg font-bold text-slate-900">Detail Laporan</h3><p id="dmSub" class="mt-1 text-xs text-slate-500"></p></div>
        <button type="button" data-close class="grid h-9 w-9 place-items-center rounded-full text-xl text-slate-600 hover:bg-slate-100" aria-label="Tutup">×</button>
      </div>
      <div id="dmNav" class="mt-3 hidden items-center justify-between rounded-lg bg-slate-50 px-2 py-2">
        <button id="dmPrev" type="button" class="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-xs font-semibold disabled:opacity-40">◄ Sebelumnya</button>
        <p id="dmPos" class="text-xs font-semibold text-slate-600"></p>
        <button id="dmNext" type="button" class="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-xs font-semibold disabled:opacity-40">Berikutnya ►</button>
      </div>
    </div>
    <div id="dmBody" class="max-h-[62vh] overflow-y-auto p-5"></div>
    <div class="flex flex-wrap justify-end gap-3 border-t px-5 py-4">
      <button id="dmDelete" type="button" class="hidden rounded-lg border border-red-200 bg-red-50 px-4 py-2 text-sm font-semibold text-red-700 hover:bg-red-100">Hapus Data Ini</button>
      <button type="button" data-close class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">Tutup</button>
      <a id="dmEdit" class="hidden rounded-lg bg-forest-700 px-4 py-2 text-sm font-semibold text-white hover:bg-forest-800" href="#">Edit Data Ini</a>
    </div>
  </div>
</div>
